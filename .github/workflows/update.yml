name: Atualizar dados do Monday
on:
  schedule: [{cron: "*/5 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: update-data
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fetch_monday.py
        env: {MONDAY_TOKEN: "${{ secrets.MONDAY_TOKEN }}"}
      - run: |
          git config user.name "painel-bot"; git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet -I'atualizado_em' || (git commit -m "dados $(date -u +%H:%M)" && git push)
