name: Atualizar dados do Monday
on:
  schedule: [{cron: "*/5 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: update-data
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install cryptography
      - run: python scripts/fetch_monday.py
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
          PAINEL_SENHA: ${{ secrets.PAINEL_SENHA }}
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
      - run: |
          git config user.name "painel-bot"; git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "dados $(date -u +%H:%M)" && git push)
